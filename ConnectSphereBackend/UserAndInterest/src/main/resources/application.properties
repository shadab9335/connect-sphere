spring.application.name=UserAndInterest

# ===== Server =====
# Port chosen so FeedService (which calls localhost:8081) can reach this service.
server.port=8081

# ===== MongoDB =====
# We set BOTH the URI and the explicit database name on purpose.
# Some Spring Boot setups silently ignore the database segment of the URI and
# fall back to the default "test" database. Setting spring.data.mongodb.database
# guarantees this app reads/writes to "UserInterest" no matter what.
spring.data.mongodb.uri=mongodb://localhost:27017/UserInterest
spring.data.mongodb.database=UserInterest
spring.data.mongodb.auto-index-creation=true

# ===== Logging =====
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.example.UserAndInterest=DEBUG
logging.file.name=logs/app.log
logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n
# Allow larger request bodies (e.g., up to 10MB for Base64 image strings)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB